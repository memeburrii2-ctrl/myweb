<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รักเพ่ยนะจุ้บๆ🩷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    background: radial-gradient(ellipse at 50% 40%, #fff3f7 0%, #ffdcea 45%, #ffc7dd 75%, #ffb8d4 100%);
    font-family:'Noto Sans Thai', sans-serif;
  }

  .wrap {
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem;
  }

  .msg {
    text-align:center;
    color:#e8447a;
    font-weight:700;
    font-size:clamp(1.8rem, 7vw, 3.2rem);
    line-height:1.5;
    text-shadow: 0 0 18px rgba(255,255,255,.8);
    animation: bounce 2.2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-10px); }
  }

  /* หัวใจลอยเบาๆ รอบๆ ข้อความ */
  .float {
    position:fixed;
    bottom:-10%;
    font-size:1.4rem;
    animation: rise linear infinite;
    opacity:.85;
  }
  @keyframes rise {
    0%   { transform:translateY(0) rotate(0deg);   opacity:0; }
    10%  { opacity:.9; }
    100% { transform:translateY(-115vh) rotate(20deg); opacity:0; }
  }
</style>
</head>
<body>

<div id="floaters"></div>

<div class="wrap">
  <div class="msg">รักเพ่ยนะจุ้บๆ<br>🎀</div>
</div>

<script>
var icons = ['🩷', '🤍', '🫪'];
var box = document.getElementById('floaters');
for (var i = 0; i < 26; i++) {
  var el = document.createElement('div');
  el.className = 'float';
  el.textContent = icons[~~(Math.random() * icons.length)];
  el.style.left = (Math.random() * 100) + 'vw';
  el.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
  var dur = 6 + Math.random() * 8;
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = (Math.random() * dur) + 's';
  box.appendChild(el);
}
</script>

</body>
</html>
