<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รักเพ่ยนะจุ้บๆ🩷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html, body{
    height:100%;
    overflow:hidden;
    background:radial-gradient(ellipse at 50% 34%, #fff3f7 0%, #ffdcea 45%, #ffc7dd 75%, #ffb8d4 100%);
    font-family:'Poppins', sans-serif;
  }
  .stage{position:fixed; inset:0;}

  /* ---------- stars ---------- */
  .stars{position:absolute; inset:0; z-index:0;}
  .star{
    position:absolute;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 6px 1px rgba(255,255,255,0.95), 0 0 3px rgba(232,93,140,0.5);
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15; transform:scale(1);}
    50%{opacity:1; transform:scale(1.35);}
  }

  /* ---------- rising sparkle dust ---------- */
  .dust{position:absolute; inset:0; z-index:1; overflow:hidden;}
  .mote{
    position:absolute;
    bottom:-5%;
    border-radius:50%;
    background:radial-gradient(circle, #ffe1ec 0%, #ff8fb3 55%, transparent 75%);
    filter:blur(0.5px);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(1); opacity:0;}
    12%{opacity:0.9;}
    100%{transform:translateY(-95vh) scale(0.4); opacity:0;}
  }

  /* ---------- glowing heart (pure CSS, no emoji) ---------- */
  .heart-wrap{
    position:absolute; top:40%; left:50%;
    transform:translate(-50%,-50%);
    z-index:2;
    animation:heartbeat 2.6s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.06);}
  }
  .heart{
    position:relative;
    width:1em; height:0.9em;
    font-size:clamp(90px, 30vw, 190px);
  }
  .heart::before, .heart::after{
    content:"";
    position:absolute;
    top:0;
    width:0.52em; height:0.8em;
    background:#ff2f74;
    border-radius:0.5em 0.5em 0 0;
    box-shadow:
      0 0 20px 4px #ff5c8a,
      0 0 45px 10px #ff2f74,
      0 0 90px 25px rgba(255,47,116,0.55);
  }
  .heart::before{
    left:0.5em;
    transform:rotate(-45deg);
    transform-origin:0 100%;
  }
  .heart::after{
    left:0;
    transform:rotate(45deg);
    transform-origin:100% 100%;
  }

  /* ---------- text centered inside heart ---------- */
  .heart-text{
    position:absolute;
    top:38%; left:50%;
    transform:translate(-50%,-50%);
    z-index:3;
    text-align:center;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    color:#ffe4ee;
    line-height:1.2;
    text-shadow:0 0 10px rgba(255,143,179,0.9), 0 0 24px rgba(255,47,116,0.6);
  }
  .heart-text .line1{
    font-size:clamp(0.8rem, 3.8vw, 1.4rem);
    letter-spacing:0.03em;
  }
  .heart-text .line2{
    font-size:clamp(1rem, 4.6vw, 1.7rem);
    font-weight:800;
    letter-spacing:0.04em;
  }

  /* ---------- orbiting love phrases ---------- */
  .orbit-label{
    position:absolute;
    top:40%; left:50%;
    z-index:2;
    color:#d63872;
    font-weight:600;
    font-size:clamp(0.72rem, 2vw, 1rem);
    text-shadow:0 0 8px rgba(255,255,255,0.9), 0 0 4px rgba(255,255,255,0.7);
    white-space:nowrap;
    will-change:transform;
  }

  @media (prefers-reduced-motion: reduce){
    .star, .mote, .heart-wrap{animation:none !important;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stars" id="stars"></div>
  <div class="dust" id="dust"></div>

  <div class="heart-wrap">
    <div class="heart"></div>
  </div>

  <div class="heart-text">
    <div class="line1">รัก</div>
    <div class="line2">เพ่ย</div>
  </div>

  <div id="orbitLayer"></div>
</div>

<script>
  // stars
  const starsEl = document.getElementById('stars');
  for(let i=0;i<140;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2 + 0.6;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDuration = (1.5 + Math.random()*3)+'s';
    s.style.animationDelay = (Math.random()*3)+'s';
    starsEl.appendChild(s);
  }

  // rising sparkle dust
  const dustEl = document.getElementById('dust');
  for(let i=0;i<60;i++){
    const m = document.createElement('div');
    m.className='mote';
    const size = 3 + Math.random()*9;
    m.style.width = size+'px';
    m.style.height = size+'px';
    m.style.left = Math.random()*100+'vw';
    m.style.animationDuration = (5 + Math.random()*7)+'s';
    m.style.animationDelay = (Math.random()*10)+'s';
    dustEl.appendChild(m);
  }

  // orbiting labels around the heart
  const phrases = [
    "รักเพ่ย", "ไอ้แว่น", "โลกน่าอยู่เพราะแฟนกูน่ารัก",
    "รัก", "22/07/2569", "รัก", "เพ่ย",
    "ที่", "สุด", "ใน", "สาม",
    "โลก", "My favorite", "น่ารัก"
  ];
  const ORBIT_SPEED = 0.00012;
  const orbitLayer = document.getElementById('orbitLayer');
  const labels = phrases.map((text, i) => {
    const el = document.createElement('div');
    el.className = 'orbit-label';
    el.textContent = text;
    orbitLayer.appendChild(el);
    return {
      el,
      angle: (Math.PI * 2 / phrases.length) * i,
      speed: ORBIT_SPEED
    };
  });

  function frame(t){
    const cx = window.innerWidth * 0.5;
    const cy = window.innerHeight * 0.40;
    const radiusX = Math.min(window.innerWidth * 0.46, 250);
    const radiusY = radiusX * 0.62;

    labels.forEach(item => {
      const a = item.angle + t * item.speed;
      const x = Math.cos(a) * radiusX;
      const y = Math.sin(a) * radiusY;
      item.el.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;
      item.el.style.opacity = (0.55 + 0.45 * ((y / radiusY + 1) / 2));
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>

</body>
</html>
